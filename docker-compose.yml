services:
  app:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    # Mantiene el contenedor vivo para compilar con g++ directo y usar VS Code.
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

  db:
    # 10.11 LTS: compatible con tus SQL (REGEXP_REPLACE, SIGNAL, DELIMITER, ENUM).
    # No usar 11.x/latest: cambia defaults estrictos y puede romper los .sql actuales.
    image: mariadb:10.11
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MARIADB_DATABASE: ${DB_NAME:-BALBU_TECH}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD:-linux01}
    volumes:
      - mariadb-data:/var/lib/mysql
      # Los .sql se importan con db/import.sh (los nombres tienen espacios y
      # necesitan orden numerico, por eso NO se montan en /docker-entrypoint-initdb.d).
      - ./modulos:/workspace/modulos:ro
    ports:
      # El puerto interno siempre es 3306 (DB_PORT). En el host se publica
      # 3307 por defecto porque en Windows suele estar ocupado por MariaDB local.
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-linux01}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  mariadb-data:
